<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>FOOZITO</title>

<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    font-family: "Times New Roman", serif;
    background-color: #0a0a0c; /* Quase preto, tom azulado */
    overflow: hidden;
}

/* A IMAGEM DE FUNDO */
.bg-image {
    position: fixed;
    top: 0; left: 0;
    width: 100vw; height: 100vh;
    background: url('bg.png') no-repeat center center;    background-size: cover;
    z-index: -2;
}

/* O FILTRO (Gradiente radial para destacar a janela no centro) */
.overlay {
    position: fixed;
    top: 0; left: 0;
    width: 100vw; height: 100vh;
    /* Escuro nas pontas, mais transparente no centro */
    background: radial-gradient(circle at center, rgba(10,10,12,0.1) 0%, rgba(10,10,12,0.85) 70%);
    z-index: -1;
}

#main {
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end; /* Empurra o conteúdo para baixo */
    text-align: center;
    color: #fff;
    text-shadow: 0 2px 15px rgba(0,0,0,0.9);
    padding-bottom: 20vh; /* Dá um respiro em relação ao fundo */
}

/* Título */
h1 {
    font-size: 3rem;
    margin: 0 0 10px 0;
    letter-spacing: 2px;
    font-weight: normal;
}

#timezone {
    font-size: 16px;
    color: #bbb;
    letter-spacing: 1px;
}

/* O BOTÃO */
.btn {
    display: inline-block;
    margin-top: 30px;
    padding: 12px 28px;
    font-size: 14px;
    color: #fff;
    text-decoration: none;
    text-transform: uppercase;
    letter-spacing: 3px;
    border: 1px solid rgba(255,255,255,0.3);
    border-radius: 2px;
    background: rgba(0,0,0,0.4);
    transition: all 0.4s ease;
    backdrop-filter: blur(5px);
}

.btn:hover {
    background: rgba(255, 180, 50, 0.1); /* Toque dourado */
    color: #ffc966; /* Texto dourado */
    border-color: #ffc966;
    box-shadow: 0 0 20px rgba(255, 180, 50, 0.2);
}

#contact {
    position: fixed;
    right: 20px;
    bottom: 16px;
    font-size: 12px;
    color: #888;
    text-align: right;
    line-height: 1.5;
    text-shadow: 0 1px 5px rgba(0,0,0,0.9);
    letter-spacing: 1px;
}
</style>

<script>
// Relógio (Portugal)
const formatter = new Intl.DateTimeFormat([], {
    timeZone: "Europe/Lisbon",
    hour: "numeric",
    minute: "numeric",
    second: "numeric",
    timeZoneName: "short"
});

function updateTime() {
    const parts = formatter.formatToParts(new Date());
    document.getElementById("time").textContent =
        parts.filter(p => p.type !== "timeZoneName").map(p => p.value).join("");
    document.getElementById("tz").textContent =
        parts.find(p => p.type === "timeZoneName").value;
}

window.onload = () => {
    updateTime();
    setInterval(updateTime, 1000);
};
</script>

</head>

<body>

<!-- Camadas de fundo -->
<div class="bg-image"></div>
<div class="overlay"></div>

<div id="main">
    <div>
        <!-- Título -->
        <h1>「FOOZITO」</h1>

        <!-- Relógio -->
        <span id="timezone">
            <i>
                TIME IN LEIRIA - 
                <span id="time">0:00</span> 
                <span id="tz">WET</span>
            </i>
        </span>

        <!-- O Único Botão -->
        <br>
        <a href="https://foozito.github.io/lousa-manteigas/" class="btn">Lousa ou Manteigas</a>
    </div> 
</div>

<div id="contact">
    <div>pvieirasamuel[at]gmail.com</div>
    <div style="margin-top: 4px;">
        leiria<br>
        portugal
    </div>
</div>

</body>
</html>

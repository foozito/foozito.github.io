<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>FOOZITO</title>

<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    font-family: "Times New Roman", serif;
    background-color: #111;
    overflow: hidden; /* Evita scroll */
}

/* A IMAGEM DE FUNDO */
.bg-image {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    /* Muda "bg.jpg" para o nome exato do ficheiro que vais fazer upload */
    background: url('bg.jpg') no-repeat center center;
    background-size: cover;
    z-index: -2;
    filter: grayscale(40%) contrast(110%); /* Ajuda a dar o tom sombrio */
}

/* O FILTRO ESCURO (OVERLAY) */
.overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: rgba(15, 15, 15, 0.65); /* Escurece a imagem e dá contraste */
    z-index: -1;
}

#main {
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    color: #fff; /* Texto branco para contrastar com o fundo escuro */
    text-shadow: 0 2px 10px rgba(0,0,0,0.5);
}

#timezone {
    font-size: 18px;
    color: #ccc;
}

/* O BOTÃO */
.btn {
    display: inline-block;
    margin-top: 30px;
    padding: 12px 28px;
    font-size: 16px;
    color: #fff;
    text-decoration: none;
    text-transform: uppercase;
    letter-spacing: 2px;
    border: 1px solid rgba(255,255,255,0.5);
    border-radius: 4px;
    background: rgba(0,0,0,0.2);
    transition: all 0.3s ease;
    backdrop-filter: blur(4px);
}

.btn:hover {
    background: #fff;
    color: #111;
    border-color: #fff;
    box-shadow: 0 0 20px rgba(255,255,255,0.3);
    text-shadow: none;
}

#contact {
    position: fixed;
    right: 16px;
    bottom: 12px;
    font-size: 14px;
    color: #999;
    text-align: right;
    line-height: 1.35;
    text-shadow: 0 1px 4px rgba(0,0,0,0.8);
}
</style>

<script>
// Relógio (Portugal)
const formatter = new Intl.DateTimeFormat([], {
    timeZone: "Europe/Lisbon",
    hour: "numeric",
    minute: "numeric",
    second: "numeric",
    timeZoneName: "short"
});

function updateTime() {
    const parts = formatter.formatToParts(new Date());
    document.getElementById("time").textContent =
        parts.filter(p => p.type !== "timeZoneName").map(p => p.value).join("");
    document.getElementById("tz").textContent =
        parts.find(p => p.type === "timeZoneName").value;
}

window.onload = () => {
    updateTime();
    setInterval(updateTime, 1000);
};
</script>

</head>

<body>

<!-- Camadas de fundo -->
<div class="bg-image"></div>
<div class="overlay"></div>

<div id="main">
    <div>
        <!-- Título -->
        <font size="12"><i><b>「FOOZITO」</b></i></font>
        <br><br>

        <!-- Relógio -->
        <span id="timezone">
            <i>
                TIME IN LEIRIA - 
                <span id="time">0:00</span> 
                <span id="tz">WET</span>
            </i>
        </span>

        <!-- O Único Botão -->
        <br><br><br>
        <a href="lousa-manteigas/" class="btn">Lousa ou Manteigas</a>
    </div>
</div>

<div id="contact">
    <div>foozito[at]gmail.com</div>
    <div style="margin-top: 8px;">
        leiria<br>
        portugal
    </div>
</div>

</body>
</html>
